name: Publish image

# Build both self-contained images and push them to GitHub Container
# Registry. Runs on each published GitHub release (tagged vX.Y.Z) and can be
# triggered manually. Uses the built-in GITHUB_TOKEN, so no extra secrets are
# needed.
#
# Two images, one matrix job each:
#   - Dockerfile          -> ghcr.io/<repo>:latest, :X.Y.Z, :X.Y  (linux/amd64,linux/arm64)
#     The lean default. No Chapter Forge ASR models.
#   - Dockerfile.unified  -> ghcr.io/<repo>:latest-chaptering, :X.Y.Z-chaptering, :X.Y-chaptering  (linux/amd64 only)
#     Same app, plus faster-whisper/ctranslate2 (~825MB) so Chapter Forge's
#     Hybrid and Full transcription ASR backends work out of the box (Audible
#     chapters, the third backend, needs no models and works in either
#     image). arm64 is left out here because Dockerfile.unified's
#     cross-copied Alpine binaries (mp4v2/fdkaac/ffmpeg) are untested on that
#     platform -- see its own header comment.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - dockerfile: Dockerfile.unified
            suffix: "-chaptering"
            platforms: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name automatically.
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
